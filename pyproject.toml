[project]
name = "birdset"
version = "0.2.0"
description = "BirdSet: A Large-Scale Dataset for Audio Classification in Avian Bioacoustics"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
    { name = "Lukas Rauch", email = "lukas.rauch@uni-kassel.de" },
    { name = "Raphael Schwinger", email = "rsc@informatik.uni-kiel.de" },
    { name = "Moritz Wirth", email = "moritz.wirt@uni-kassel.de" },
    { name = "Rene Heinrich", email = "rene.heinrich@iee.fraunhofer.de" },
    { name = "Jonas Lange", email = "jla@informatik.uni-kiel.de" }
]
dependencies = [
    "scipy>=1.11.3",
    "ffprobe>=0.5",
    
    # --------- PyTorch --------- #
    "torch==2.0.1",
    "torchvision==0.15.2",
    "torchaudio==2.0.2",
    "lightning>=2.2.2",
    "torchmetrics>=0.11",

    # --------- TensorFlow --------- #
    "tensorflow[and-cuda]==2.14",
    "tensorflow-hub>=0.16.1",
    "tensorboard>=2.14.1",

    # --------- Hydra --------- #
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2",

    # --------- Tools & Utils --------- #
    "rootutils>=1.0.7",
    "pre-commit>=3.5.0",
    "rich==13.7.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "ipywidgets>=8.1.1",
    "jupyter>=1.0.0",
    "datasets==2.18.0",
    "audiomentations==0.34.1",
    "torch-audiomentations==0.11.0",
    "wandb>=0.16.0",
    "transformers==4.38.0",
    "pyrootutils>=1.0.4",
    "mlflow>=2.11.0",
    "pydub>=0.25.1",
    "tabulate>=0.9.0",
    "timm==1.0.12",
    "einops>=0.8.0",
    # "tensorrt==8.5.3.1", # Warning: TensorRT is often tricky on PyPI, verify if this wheel exists
    "numba==0.60.0",
    "numpy>=1.26.4,<2.0.0", # Pinned <2.0 because torch 2.0.1 likely incompatible with numpy 2
    "black>=24.10.0",
    "torchinfo>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.25.2",
    "plumbum>=1.8.2",
    "jsonlines>=4.0.0",
    "kaggle>=1.6.11",
]

# --------- Build System --------- #
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"birdset" = "birdset"
"projects/biofoundation" = "biofoundation"

# --------- UV Configuration --------- #
[tool.uv]
package = true
cache-dir = "./.uv_cache"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

# Force specific packages to pull from the CUDA Index
[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

# Handle the local submodule
biofoundation = { path = "projects/biofoundation", editable = true }